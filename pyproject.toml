[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-protocol"
version = "0.1.0"
description = "Universal GraphRAG Interoperability Protocol - standard contracts + MCP server + adapters to query any GraphRAG backend uniformly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "graphrag-protocol contributors" }
]
keywords = ["graphrag", "knowledge-graph", "mcp", "retrieval", "graph", "protocol", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core protocol: models + contracts only. Serving/adapters are extras so
    # the protocol core installs light (see README "Installation").
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
server = [
    # HTTP demo server (FastAPI) + MCP stdio server (mcp SDK)
    "fastapi",
    "uvicorn",
    "mcp>=2",
    "httpx",
]
tigergraph = [
    "pyTigerGraph",
]
llm = [
    "google-genai",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
rag = [
    "chromadb",
]
eval = [
    "bert-score",
]

[project.scripts]
# Real MCP server (stdio) — expose the protocol contracts as MCP tools
graphrag-mcp = "mcp_server.mcp_server:main"
# HTTP demo/dashboard server (FastAPI)
graphrag-server = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is fast and hermetic: live-backend tests are marked
# `integration` (and additionally skip themselves when creds are absent).
# Run them explicitly with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit a live backend (TigerGraph/LLM). Deselect with -m 'not integration'.",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyTigerGraph.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# TigerGraph adapter intentionally swallows backend errors everywhere so every
# operation degrades gracefully (empty-but-valid context) instead of crashing.
"mcp_server/adapters/tigergraph_adapter.py" = ["BLE001", "S110", "S112"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
