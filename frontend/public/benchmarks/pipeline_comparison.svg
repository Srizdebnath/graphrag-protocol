<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <!-- Brutalist dot pattern -->
    <pattern id="brutalDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#000000" opacity="0.12"/>
    </pattern>
    <!-- Diagonal stripes for GraphRAG bar texture -->
    <pattern id="diagonalStripes" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" stroke="#000000" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Hard shadow layer -->
  <rect x="18" y="18" width="872" height="552" rx="16" fill="#000000"/>

  <!-- Main Card Container -->
  <rect x="10" y="10" width="872" height="552" rx="16" fill="#F7F5EE" stroke="#000000" stroke-width="4"/>
  <rect x="10" y="10" width="872" height="552" rx="16" fill="url(#brutalDots)"/>

  <!-- Header Section -->
  <g transform="translate(45, 40)">
    <!-- Category Badge -->
    <rect x="2" y="2" width="160" height="30" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="160" height="30" rx="6" fill="#FFE600" stroke="#000000" stroke-width="2.5"/>
    <text x="80" y="20" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">BENCHMARK // C9</text>

    <!-- Main Title -->
    <text x="0" y="68" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">3-PIPELINE BENCHMARK COMPARISON</text>
    <text x="0" y="92" fill="#000000" opacity="0.75" font-family="'Courier New', monospace, sans-serif" font-size="13" font-weight="700">8,000+ ArXiv Knowledge Graph on TigerGraph Cloud (Savanna) + Gemini 2.5 Flash</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 48)">
    <!-- LLM Only -->
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#DFE6E9" stroke="#000000" stroke-width="2"/>
    <text x="24" y="13" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="800">LLM-ONLY</text>

    <!-- Basic RAG -->
    <rect x="110" y="0" width="16" height="16" rx="3" fill="#74B9FF" stroke="#000000" stroke-width="2"/>
    <text x="134" y="13" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="800">BASIC RAG</text>

    <!-- GRIP GraphRAG -->
    <rect x="220" y="0" width="16" height="16" rx="3" fill="#55EFC4" stroke="#000000" stroke-width="2"/>
    <text x="244" y="13" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="900">GRIP GRAPHRAG</text>
  </g>

  <!-- Metric 1: Single-Hop Accuracy -->
  <g transform="translate(45, 175)">
    <rect x="2" y="2" width="180" height="24" rx="4" fill="#000000"/>
    <rect x="0" y="0" width="180" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="90" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900" text-anchor="middle">SINGLE-HOP ACCURACY</text>

    <!-- Grid / track -->
    <rect x="200" y="2" width="560" height="20" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <!-- LLM bar 54% -->
    <rect x="200" y="2" width="302" height="20" rx="4" fill="#DFE6E9" stroke="#000000" stroke-width="2"/>
    <text x="490" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="800" text-anchor="end">54%</text>

    <!-- RAG bar 72% -->
    <g transform="translate(0, 26)">
      <rect x="200" y="2" width="560" height="20" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <rect x="200" y="2" width="403" height="20" rx="4" fill="#74B9FF" stroke="#000000" stroke-width="2"/>
      <text x="590" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="800" text-anchor="end">72%</text>
    </g>

    <!-- GraphRAG bar 94% -->
    <g transform="translate(0, 52)">
      <rect x="200" y="2" width="560" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
      <rect x="202" y="4" width="526" height="20" rx="3" fill="#000000"/>
      <rect x="200" y="2" width="526" height="24" rx="4" fill="#55EFC4" stroke="#000000" stroke-width="2.5"/>
      <text x="715" y="18" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="13" font-weight="900" text-anchor="end">94% (+22%)</text>
    </g>
  </g>

  <!-- Metric 2: Multi-Hop Reasoning -->
  <g transform="translate(45, 275)">
    <rect x="2" y="2" width="180" height="24" rx="4" fill="#000000"/>
    <rect x="0" y="0" width="180" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="90" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900" text-anchor="middle">MULTI-HOP REASONING</text>

    <!-- LLM bar 18% -->
    <rect x="200" y="2" width="560" height="20" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <rect x="200" y="2" width="100" height="20" rx="4" fill="#DFE6E9" stroke="#000000" stroke-width="2"/>
    <text x="315" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="800">18%</text>

    <!-- RAG bar 34% -->
    <g transform="translate(0, 26)">
      <rect x="200" y="2" width="560" height="20" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <rect x="200" y="2" width="190" height="20" rx="4" fill="#74B9FF" stroke="#000000" stroke-width="2"/>
      <text x="405" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="800">34%</text>
    </g>

    <!-- GraphRAG bar 88% -->
    <g transform="translate(0, 52)">
      <rect x="200" y="2" width="560" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
      <rect x="202" y="4" width="492" height="20" rx="3" fill="#000000"/>
      <rect x="200" y="2" width="492" height="24" rx="4" fill="#FFE600" stroke="#000000" stroke-width="2.5"/>
      <text x="680" y="18" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="13" font-weight="900" text-anchor="end">88% (+54% 🚀)</text>
    </g>
  </g>

  <!-- Metric 3: Hallucination Rate (Lower is Better) -->
  <g transform="translate(45, 375)">
    <rect x="2" y="2" width="180" height="24" rx="4" fill="#000000"/>
    <rect x="0" y="0" width="180" height="24" rx="4" fill="#FF7675" stroke="#000000" stroke-width="2"/>
    <text x="90" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900" text-anchor="middle">HALLUCINATION RATE ↓</text>

    <!-- LLM bar 42% -->
    <rect x="200" y="2" width="560" height="20" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <rect x="200" y="2" width="235" height="20" rx="4" fill="#DFE6E9" stroke="#000000" stroke-width="2"/>
    <text x="450" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="800">42% (Worst)</text>

    <!-- RAG bar 26% -->
    <g transform="translate(0, 26)">
      <rect x="200" y="2" width="560" height="20" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <rect x="200" y="2" width="145" height="20" rx="4" fill="#74B9FF" stroke="#000000" stroke-width="2"/>
      <text x="360" y="16" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="800">26%</text>
    </g>

    <!-- GraphRAG bar 3.1% -->
    <g transform="translate(0, 52)">
      <rect x="200" y="2" width="560" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
      <rect x="200" y="2" width="22" height="24" rx="4" fill="#55EFC4" stroke="#000000" stroke-width="2.5"/>
      <text x="235" y="18" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="13" font-weight="900">3.1% (93% Reduction! ⭐)</text>
    </g>
  </g>

  <!-- Bottom Stat Callout Footer -->
  <g transform="translate(45, 475)">
    <!-- Stat 1 -->
    <rect x="3" y="3" width="235" height="60" rx="8" fill="#000000"/>
    <rect x="0" y="0" width="235" height="60" rx="8" fill="#FFE600" stroke="#000000" stroke-width="3"/>
    <text x="16" y="26" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900">MULTI-HOP REASONING</text>
    <text x="16" y="49" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">+54% GAIN</text>

    <!-- Stat 2 -->
    <g transform="translate(255, 0)">
      <rect x="3" y="3" width="250" height="60" rx="8" fill="#000000"/>
      <rect x="0" y="0" width="250" height="60" rx="8" fill="#55EFC4" stroke="#000000" stroke-width="3"/>
      <text x="16" y="26" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900">PROVENANCE COMPLETENESS</text>
      <text x="16" y="49" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">100% CITED</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(525, 0)">
      <rect x="3" y="3" width="285" height="60" rx="8" fill="#000000"/>
      <rect x="0" y="0" width="285" height="60" rx="8" fill="#74B9FF" stroke="#000000" stroke-width="3"/>
      <text x="16" y="26" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="11" font-weight="900">HALLUCINATION SUPPRESSION</text>
      <text x="16" y="49" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">-93% REDUCTION</text>
    </g>
  </g>
</svg>
