<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <pattern id="brutalDots3" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#000000" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Hard shadow -->
  <rect x="18" y="18" width="872" height="552" rx="16" fill="#000000"/>

  <!-- Main Container -->
  <rect x="10" y="10" width="872" height="552" rx="16" fill="#F7F5EE" stroke="#000000" stroke-width="4"/>
  <rect x="10" y="10" width="872" height="552" rx="16" fill="url(#brutalDots3)"/>

  <!-- Header -->
  <g transform="translate(45, 40)">
    <rect x="2" y="2" width="180" height="30" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#A29BFE" stroke="#000000" stroke-width="2.5"/>
    <text x="90" y="20" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">MULTI-HOP REASONING</text>

    <text x="0" y="68" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">THE MULTI-HOP CLIFF EFFECT</text>
    <text x="0" y="92" fill="#000000" opacity="0.75" font-family="'Courier New', monospace" font-size="13" font-weight="700">How accuracy scales as question complexity increases from 1 to 5 graph hops</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 48)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#DFE6E9" stroke="#000000" stroke-width="2"/>
    <text x="24" y="13" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="800">LLM-ONLY</text>

    <rect x="110" y="0" width="16" height="16" rx="3" fill="#74B9FF" stroke="#000000" stroke-width="2"/>
    <text x="134" y="13" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="800">BASIC RAG</text>

    <rect x="220" y="0" width="16" height="16" rx="3" fill="#FFE600" stroke="#000000" stroke-width="2"/>
    <text x="244" y="13" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900">GRIP PROTOCOL</text>
  </g>

  <!-- Main Chart Canvas -->
  <g transform="translate(45, 150)">
    <rect x="4" y="4" width="810" height="290" rx="12" fill="#000000"/>
    <rect x="0" y="0" width="810" height="290" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

    <!-- Y Grid lines -->
    <g stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="80" y1="40" x2="770" y2="40"/>
      <line x1="80" y1="90" x2="770" y2="90"/>
      <line x1="80" y1="140" x2="770" y2="140"/>
      <line x1="80" y1="190" x2="770" y2="190"/>
      <line x1="80" y1="240" x2="770" y2="240"/>
    </g>

    <!-- Y Labels -->
    <text x="65" y="45" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">100%</text>
    <text x="65" y="95" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">75%</text>
    <text x="65" y="145" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">50%</text>
    <text x="65" y="195" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">25%</text>
    <text x="65" y="245" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">0%</text>

    <!-- X Axis Line -->
    <line x1="80" y1="240" x2="770" y2="240" stroke="#000000" stroke-width="3"/>

    <!-- Hop X-ticks & columns: 1-hop (130), 2-hop (280), 3-hop (430), 4-hop (580), 5-hop (720) -->
    <text x="140" y="265" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">1-HOP</text>
    <text x="290" y="265" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">2-HOPS</text>
    <text x="440" y="265" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">3-HOPS</text>
    <text x="590" y="265" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">4-HOPS</text>
    <text x="730" y="265" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">5-HOPS (DEEP)</text>

    <!-- Curve 1: LLM-Only (54% -> 22% -> 12% -> 6% -> 2%) -->
    <!-- y values: 100%=40, 0%=240 -> scale: y = 240 - acc*2 -->
    <!-- 54% -> 132, 22% -> 196, 12% -> 216, 6% -> 228, 2% -> 236 -->
    <path d="M 140 132 L 290 196 L 440 216 L 590 228 L 730 236" fill="none" stroke="#636E72" stroke-width="3" stroke-dasharray="5 5"/>
    <g fill="#DFE6E9" stroke="#000000" stroke-width="2">
      <circle cx="140" cy="132" r="5"/>
      <circle cx="290" cy="196" r="5"/>
      <circle cx="440" cy="216" r="5"/>
      <circle cx="590" cy="228" r="5"/>
      <circle cx="730" cy="236" r="5"/>
    </g>

    <!-- Curve 2: Basic Vector RAG (72% -> 46% -> 24% -> 14% -> 8%) -->
    <!-- 72% -> 96, 46% -> 148, 24% -> 192, 14% -> 212, 8% -> 224 -->
    <path d="M 140 96 L 290 148 L 440 192 L 590 212 L 730 224" fill="none" stroke="#74B9FF" stroke-width="4"/>
    <g fill="#74B9FF" stroke="#000000" stroke-width="2">
      <circle cx="140" cy="96" r="6"/>
      <circle cx="290" cy="148" r="6"/>
      <circle cx="440" cy="192" r="6"/>
      <circle cx="590" cy="212" r="6"/>
      <circle cx="730" cy="224" r="6"/>
    </g>

    <!-- Curve 3: GRIP GraphRAG (94% -> 91% -> 88% -> 85% -> 81%) -->
    <!-- 94% -> 52, 91% -> 58, 88% -> 64, 85% -> 70, 81% -> 78 -->
    <!-- Shadow stroke -->
    <path d="M 140 54 L 290 60 L 440 66 L 590 72 L 730 80" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    <path d="M 140 52 L 290 58 L 440 64 L 590 70 L 730 78" fill="none" stroke="#FFE600" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Data Nodes with Brutalist Badges -->
    <g transform="translate(140, 52)">
      <circle cx="0" cy="0" r="8" fill="#FFE600" stroke="#000000" stroke-width="2.5"/>
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#000000"/>
      <rect x="-25" y="-29" width="48" height="20" rx="4" fill="#FFE600" stroke="#000000" stroke-width="1.5"/>
      <text x="-1" y="-15" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">94%</text>
    </g>

    <g transform="translate(290, 58)">
      <circle cx="0" cy="0" r="8" fill="#FFE600" stroke="#000000" stroke-width="2.5"/>
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#000000"/>
      <rect x="-25" y="-29" width="48" height="20" rx="4" fill="#FFE600" stroke="#000000" stroke-width="1.5"/>
      <text x="-1" y="-15" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">91%</text>
    </g>

    <g transform="translate(440, 64)">
      <circle cx="0" cy="0" r="8" fill="#FFE600" stroke="#000000" stroke-width="2.5"/>
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#000000"/>
      <rect x="-25" y="-29" width="48" height="20" rx="4" fill="#FFE600" stroke="#000000" stroke-width="1.5"/>
      <text x="-1" y="-15" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">88%</text>
    </g>

    <g transform="translate(590, 70)">
      <circle cx="0" cy="0" r="8" fill="#FFE600" stroke="#000000" stroke-width="2.5"/>
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#000000"/>
      <rect x="-25" y="-29" width="48" height="20" rx="4" fill="#FFE600" stroke="#000000" stroke-width="1.5"/>
      <text x="-1" y="-15" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">85%</text>
    </g>

    <g transform="translate(730, 78)">
      <circle cx="0" cy="0" r="8" fill="#55EFC4" stroke="#000000" stroke-width="2.5"/>
      <rect x="-24" y="-28" width="48" height="20" rx="4" fill="#000000"/>
      <rect x="-25" y="-29" width="48" height="20" rx="4" fill="#55EFC4" stroke="#000000" stroke-width="1.5"/>
      <text x="-1" y="-15" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">81%</text>
    </g>

    <!-- Callout on 5-Hop: 10x Differential -->
    <g transform="translate(610, 160)">
      <rect x="3" y="3" width="180" height="50" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="180" height="50" rx="6" fill="#FF7675" stroke="#000000" stroke-width="2"/>
      <text x="12" y="20" fill="#000000" font-family="'Courier New', monospace" font-size="10" font-weight="900">5-HOP ACCURACY CLIFF</text>
      <text x="12" y="38" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900">GRIP 81% vs RAG 8% (10x)</text>
    </g>
  </g>

  <!-- Bottom Explanatory Strip -->
  <g transform="translate(45, 460)">
    <rect x="3" y="3" width="810" height="80" rx="10" fill="#000000"/>
    <rect x="0" y="0" width="810" height="80" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

    <g transform="translate(20, 15)">
      <text x="0" y="16" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900">WHY VECTOR RAG COLLAPSES ON 2+ HOPS:</text>
      <text x="0" y="34" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="10" font-weight="700">Cosine similarity retrieves isolated text fragments without topological awareness.</text>
      <text x="0" y="49" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="10" font-weight="700">GRIP Contract 1 &amp; 2 follow deterministic edge traversals across connected entities.</text>
    </g>
  </g>
</svg>
