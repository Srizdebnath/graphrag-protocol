    <text x="87" y="20" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">EXECUTIVE SCORECARD</text>

    <text x="0" y="68" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">GRIP BENCHMARK SCORECARD</text>
    <text x="0" y="92" fill="#000000" opacity="0.75" font-family="'Courier New', monospace" font-size="13" font-weight="700">Validated across 49,656 vertices &amp; 79,044 edges on TigerGraph Cloud + Gemini 2.5 Flash</text>
