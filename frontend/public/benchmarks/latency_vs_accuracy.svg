<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <pattern id="brutalDots2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#000000" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Hard drop shadow -->
  <rect x="18" y="18" width="872" height="552" rx="16" fill="#000000"/>

  <!-- Main Card Container -->
  <rect x="10" y="10" width="872" height="552" rx="16" fill="#F7F5EE" stroke="#000000" stroke-width="4"/>
  <rect x="10" y="10" width="872" height="552" rx="16" fill="url(#brutalDots2)"/>

  <!-- Header Section -->
  <g transform="translate(45, 40)">
    <rect x="2" y="2" width="170" height="30" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#55EFC4" stroke="#000000" stroke-width="2.5"/>
    <text x="85" y="20" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">PARETO FRONTIER</text>

    <text x="0" y="68" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">LATENCY VS ACCURACY TRADE-OFF</text>
    <text x="0" y="92" fill="#000000" opacity="0.75" font-family="'Courier New', monospace, sans-serif" font-size="13" font-weight="700">GRIP Multi-Tier Routing vs Unoptimized Graph Traversal &amp; Vector Baseline</text>
  </g>

  <!-- Chart Canvas Card -->
  <g transform="translate(45, 150)">
    <rect x="4" y="4" width="580" height="380" rx="12" fill="#000000"/>
    <rect x="0" y="0" width="580" height="380" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

    <!-- Grid lines -->
    <g stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="60" y1="60" x2="540" y2="60"/>
      <line x1="60" y1="120" x2="540" y2="120"/>
      <line x1="60" y1="180" x2="540" y2="180"/>
      <line x1="60" y1="240" x2="540" y2="240"/>
      <line x1="60" y1="300" x2="540" y2="300"/>

      <line x1="150" y1="40" x2="150" y2="320"/>
      <line x1="250" y1="40" x2="250" y2="320"/>
      <line x1="350" y1="40" x2="350" y2="320"/>
      <line x1="450" y1="40" x2="450" y2="320"/>
    </g>

    <!-- Axes -->
    <line x1="60" y1="320" x2="550" y2="320" stroke="#000000" stroke-width="3"/>
    <line x1="60" y1="320" x2="60" y2="30" stroke="#000000" stroke-width="3"/>

    <!-- Y-Axis Labels (Accuracy %) -->
    <text x="48" y="65" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">100%</text>
    <text x="48" y="125" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">80%</text>
    <text x="48" y="185" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">60%</text>
    <text x="48" y="245" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">40%</text>
    <text x="48" y="305" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="end">20%</text>

    <!-- X-Axis Labels (Latency ms) -->
    <text x="60" y="340" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">100ms</text>
    <text x="150" y="340" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">250ms</text>
    <text x="250" y="340" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">500ms</text>
    <text x="350" y="340" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">1.0s</text>
    <text x="450" y="340" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">2.5s</text>
    <text x="540" y="340" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">5.0s</text>

    <!-- Axis Titles -->
    <text x="300" y="365" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">RETRIEVAL LATENCY (LOG SCALE) &#8594;</text>
    <text x="-180" y="20" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle" transform="rotate(-90)">EVALUATION ACCURACY &#8594;</text>

    <!-- Pareto Optimal Frontier Curve (GRIP) -->
    <path d="M 80 270 Q 140 180 240 100 T 420 68 T 520 62" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M 80 270 Q 140 180 240 100 T 420 68 T 520 62" fill="none" stroke="#55EFC4" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Data Points -->
    <!-- Point 1: LLM-Only (Fast, inaccurate) -->
    <g transform="translate(100, 260)">
      <circle cx="2" cy="2" r="9" fill="#000000"/>
      <circle cx="0" cy="0" r="9" fill="#DFE6E9" stroke="#000000" stroke-width="2.5"/>
      <rect x="12" y="-12" width="75" height="20" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="49" y="2" fill="#000000" font-family="'Courier New', monospace" font-size="9" font-weight="900" text-anchor="middle">LLM-ONLY</text>
    </g>

    <!-- Point 2: Vector RAG -->
    <g transform="translate(180, 205)">
      <circle cx="2" cy="2" r="9" fill="#000000"/>
      <circle cx="0" cy="0" r="9" fill="#74B9FF" stroke="#000000" stroke-width="2.5"/>
      <rect x="12" y="-12" width="75" height="20" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="49" y="2" fill="#000000" font-family="'Courier New', monospace" font-size="9" font-weight="900" text-anchor="middle">VECTOR RAG</text>
    </g>

    <!-- Point 3: Naive Unoptimized GraphRAG (High latency, mediocre) -->
    <g transform="translate(480, 150)">
      <circle cx="2" cy="2" r="9" fill="#000000"/>
      <circle cx="0" cy="0" r="9" fill="#FF7675" stroke="#000000" stroke-width="2.5"/>
      <rect x="-105" y="-12" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="-55" y="2" fill="#000000" font-family="'Courier New', monospace" font-size="9" font-weight="900" text-anchor="middle">UNOPTIMIZED KG</text>
    </g>

    <!-- Point 4: GRIP Fast Auto-Search (Sweet Spot) -->
    <g transform="translate(240, 100)">
      <circle cx="3" cy="3" r="14" fill="#000000"/>
      <circle cx="0" cy="0" r="14" fill="#FFE600" stroke="#000000" stroke-width="3"/>
      <!-- Star / pin icon -->
      <polygon points="0,-7 2,-2 7,-2 3,2 5,7 0,4 -5,7 -3,2 -7,-2 -2,-2" fill="#000000"/>
      <!-- Callout Badge -->
      <rect x="18" y="-22" width="150" height="34" rx="6" fill="#000000"/>
      <rect x="16" y="-24" width="150" height="34" rx="6" fill="#FFE600" stroke="#000000" stroke-width="2"/>
      <text x="91" y="-11" fill="#000000" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle">GRIP HYBRID ROUTE</text>
      <text x="91" y="2" fill="#000000" font-family="'Courier New', monospace" font-size="9" font-weight="800" text-anchor="middle">480ms // 92% Acc</text>
    </g>

    <!-- Point 5: GRIP Autonomous Agentic (Max Accuracy) -->
    <g transform="translate(430, 68)">
      <circle cx="3" cy="3" r="14" fill="#000000"/>
      <circle cx="0" cy="0" r="14" fill="#55EFC4" stroke="#000000" stroke-width="3"/>
      <!-- Checkmark -->
      <path d="M-5,0 L-1,4 L6,-4" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="18" y="-12" width="135" height="34" rx="6" fill="#000000"/>
      <rect x="16" y="-14" width="135" height="34" rx="6" fill="#55EFC4" stroke="#000000" stroke-width="2"/>
      <text x="83" y="-1" fill="#000000" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle">GRIP AGENTIC</text>
      <text x="83" y="12" fill="#000000" font-family="'Courier New', monospace" font-size="9" font-weight="800" text-anchor="middle">1.8s // 96% Acc</text>
    </g>
  </g>

  <!-- Right Insights Panel -->
  <g transform="translate(645, 150)">
    <!-- Insight Card 1 -->
    <rect x="3" y="3" width="215" height="115" rx="10" fill="#000000"/>
    <rect x="0" y="0" width="215" height="115" rx="10" fill="#FFE600" stroke="#000000" stroke-width="3"/>
    <text x="14" y="24" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900">THE SWEET SPOT</text>
    <text x="14" y="48" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900">480ms Latency</text>
    <text x="14" y="68" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">Contract 1 auto-routing fuses</text>
    <text x="14" y="81" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">vector + graph neighborhood</text>
    <text x="14" y="94" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">for sub-second responses.</text>

    <!-- Insight Card 2 -->
    <g transform="translate(0, 130)">
      <rect x="3" y="3" width="215" height="115" rx="10" fill="#000000"/>
      <rect x="0" y="0" width="215" height="115" rx="10" fill="#74B9FF" stroke="#000000" stroke-width="3"/>
      <text x="14" y="24" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900">AGENTIC TRACE</text>
      <text x="14" y="48" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900">96.4% Acc</text>
      <text x="14" y="68" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">Multi-step autonomous agent</text>
      <text x="14" y="81" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">navigates complex graph chains</text>
      <text x="14" y="94" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">without hallucination.</text>
    </g>

    <!-- Insight Card 3 -->
    <g transform="translate(0, 260)">
      <rect x="3" y="3" width="215" height="120" rx="10" fill="#000000"/>
      <rect x="0" y="0" width="215" height="120" rx="10" fill="#A29BFE" stroke="#000000" stroke-width="3"/>
      <text x="14" y="24" fill="#000000" font-family="'Courier New', monospace" font-size="11" font-weight="900">ROI CLASSIFIER // C20</text>
      <text x="14" y="48" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900">Token-ROI 5.4x</text>
      <text x="14" y="68" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">Contract 20 predicts when</text>
      <text x="14" y="81" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">to run fast RAG vs deep</text>
      <text x="14" y="94" fill="#000000" opacity="0.85" font-family="'Courier New', monospace" font-size="9" font-weight="700">Agentic GraphRAG dynamically.</text>
    </g>
  </g>
</svg>
